# Horizontal Pod Autoscaler - scales the backend based on CPU load.
# Use this for the live "scaling" demo: generate load against the
# backend and watch replicas increase automatically.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: incidentops-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: incidentops-backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
